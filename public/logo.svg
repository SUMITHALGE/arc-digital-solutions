<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD400;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    
    <!-- Dark Gradient -->
    <radialGradient id="darkGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong Glow -->
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Central Circle (Earth-like) -->
  <circle 
    cx="90" 
    cy="90" 
    r="45" 
    fill="url(#darkGradient)"
    stroke="url(#goldGradient)"
    stroke-width="2"
  >
    <animate 
      attributeName="stroke-opacity" 
      values="0.5;1;0.5" 
      dur="3s" 
      repeatCount="indefinite"
    />
  </circle>

  <!-- Main Arc (Top) - Earth's curve effect -->
  <g filter="url(#strongGlow)">
    <path 
      d="M 30 90 Q 90 30, 150 90" 
      stroke="url(#goldGradient)" 
      stroke-width="4" 
      fill="none"
      stroke-linecap="round"
    >
      <animate 
        attributeName="stroke-width" 
        values="4;6;4" 
        dur="2s" 
        repeatCount="indefinite"
      />
    </path>
  </g>

  <!-- Secondary Arc (Bottom) -->
  <g filter="url(#glow)">
    <path 
      d="M 30 90 Q 90 150, 150 90" 
      stroke="#FFD400" 
      stroke-width="3" 
      fill="none"
      stroke-linecap="round"
      opacity="0.6"
    >
      <animate 
        attributeName="opacity" 
        values="0.3;0.8;0.3" 
        dur="3s" 
        repeatCount="indefinite"
      />
    </path>
  </g>

  <!-- Orbital Ring 1 -->
  <circle 
    cx="90" 
    cy="90" 
    r="60" 
    fill="none" 
    stroke="#FFD400" 
    stroke-width="1.5" 
    opacity="0.3"
    stroke-dasharray="5 10"
  >
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 90 90"
      to="360 90 90"
      dur="15s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Orbital Ring 2 -->
  <circle 
    cx="90" 
    cy="90" 
    r="70" 
    fill="none" 
    stroke="#FFD400" 
    stroke-width="1" 
    opacity="0.2"
    stroke-dasharray="3 15"
  >
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="360 90 90"
      to="0 90 90"
      dur="20s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Letter 'A' integrated with design -->
  <g filter="url(#glow)">
    <path 
      d="M 75 100 L 85 75 L 95 100" 
      stroke="url(#goldGradient)" 
      stroke-width="6" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="none"
    />
    <line 
      x1="78" 
      y1="92" 
      x2="92" 
      y2="92" 
      stroke="#FFD400" 
      stroke-width="4" 
      stroke-linecap="round"
    />
  </g>

  <!-- Letter 'D' -->
  <g filter="url(#glow)">
    <line 
      x1="100" 
      y1="75" 
      x2="100" 
      y2="100" 
      stroke="url(#goldGradient)" 
      stroke-width="6" 
      stroke-linecap="round"
    />
    <path 
      d="M 100 75 Q 115 82, 115 87.5 Q 115 93, 100 100" 
      stroke="url(#goldGradient)" 
      stroke-width="6" 
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- Orbiting Particles -->
  <!-- Particle 1 -->
  <circle cx="0" cy="0" r="2.5" fill="#FFD400" filter="url(#glow)">
    <animateMotion 
      dur="4s" 
      repeatCount="indefinite"
      path="M 30 90 Q 90 30, 150 90 Q 90 150, 30 90"
    />
    <animate 
      attributeName="opacity" 
      values="1;0.3;1" 
      dur="4s" 
      repeatCount="indefinite"
    />
  </circle>

  <!-- Particle 2 -->
  <circle cx="0" cy="0" r="2" fill="#FFD400" filter="url(#glow)">
    <animateMotion 
      dur="5s" 
      repeatCount="indefinite"
      path="M 150 90 Q 90 30, 30 90 Q 90 150, 150 90"
    />
    <animate 
      attributeName="opacity" 
      values="0.3;1;0.3" 
      dur="5s" 
      repeatCount="indefinite"
    />
  </circle>

  <!-- Particle 3 -->
  <circle cx="0" cy="0" r="1.5" fill="#FFA500" filter="url(#glow)">
    <animateMotion 
      dur="6s" 
      repeatCount="indefinite"
      path="M 90 30 Q 150 90, 90 150 Q 30 90, 90 30"
    />
  </circle>

  <!-- Corner Accent Dots -->
  <g opacity="0.8">
    <circle cx="20" cy="20" r="2" fill="#FFD400">
      <animate 
        attributeName="opacity" 
        values="0.3;1;0.3" 
        dur="2s" 
        repeatCount="indefinite"
      />
    </circle>
    
    <circle cx="160" cy="20" r="2" fill="#FFD400">
      <animate 
        attributeName="opacity" 
        values="0.3;1;0.3" 
        dur="2s" 
        begin="0.5s"
        repeatCount="indefinite"
      />
    </circle>
    
    <circle cx="20" cy="160" r="2" fill="#FFD400">
      <animate 
        attributeName="opacity" 
        values="0.3;1;0.3" 
        dur="2s" 
        begin="1s"
        repeatCount="indefinite"
      />
    </circle>
    
    <circle cx="160" cy="160" r="2" fill="#FFD400">
      <animate 
        attributeName="opacity" 
        values="0.3;1;0.3" 
        dur="2s" 
        begin="1.5s"
        repeatCount="indefinite"
      />
    </circle>
  </g>

  <!-- Text "arc" subtle -->
  <text 
    x="90" 
    y="125" 
    font-family="Arial, sans-serif" 
    font-size="10" 
    font-weight="bold"
    fill="#FFD400" 
    text-anchor="middle"
    opacity="0.5"
  >
    ARC
  </text>
</svg>